<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A27;--sf:#172536;--ink:#E8EEF5;--mut:#93A3B8;--ac:#4CC2A8;--acx:#0F1A27;--bad:#F08A5D;--ln:#27394D}}
:root[data-theme="dark"]{--bg:#0F1A27;--sf:#172536;--ink:#E8EEF5;--mut:#93A3B8;--ac:#4CC2A8;--acx:#0F1A27;--bad:#F08A5D;--ln:#27394D}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}

main{max-width:520px;margin:0 auto;padding:20px 16px 40px}

.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}

button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;width:100%;font:inherit;color:inherit}
.hz{font-family:"Noto Serif SC","Noto Sans KR","Songti SC","Malgun Gothic","Apple SD Gothic Neo","SimSun",serif;font-size:5rem;line-height:1.1;margin:0}
.py{font-size:1.5rem;color:var(--act,var(--ac));font-weight:600;margin:12px 0 0}
.mn{font-size:1.25rem;margin:4px 0 0}
.hint{color:var(--mut);font-size:.85rem;margin-top:16px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;font-weight:600;padding:12px;border-radius:12px;cursor:pointer}

.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;padding:14px;border-radius:12px;cursor:pointer}

.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin:10px 0 18px}

.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;text-align:center}

.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px}
.lv{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.exb{white-space:pre-wrap;margin-top:14px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;font-size:.92rem;line-height:1.6}
.exb:empty{display:none}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.abc button{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 4px;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.abc .g{font-size:1.6rem;line-height:1.2;font-family:"Noto Serif SC","Noto Sans KR",serif}
.abc .r{font-size:.72rem;color:var(--mut);text-align:center;overflow-wrap:anywhere}
.ill{margin-top:12px;background:#F7FAFC;border:1px solid var(--ln);border-radius:12px;padding:8px;text-align:center;min-height:60px;color:#5C6B80;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.ill img{max-width:100%;height:auto;max-height:260px}
.clog{min-height:180px;max-height:48vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.b{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;font-size:.92rem;line-height:1.55}
.b.user{align-self:flex-end;background:var(--ac);color:var(--acx)}
.b.assistant{align-self:flex-start;background:var(--sf);border:1px solid var(--ln)}
.sug{display:flex;flex-wrap:wrap;gap:6px}
.sug button{border:1px solid var(--ln);background:none;color:var(--mut);font:inherit;font-size:.8rem;padding:6px 10px;border-radius:999px;cursor:pointer}
.cin{-webkit-appearance:none;appearance:none;flex:1;min-width:0;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;padding:12px;border-radius:12px}
[data-lg="ko"] .hz{font-size:clamp(2.2rem,11vw,3.4rem)}
[data-lg="en"] .hz{font-size:clamp(1.8rem,8vw,2.8rem);overflow-wrap:anywhere}
.lv button{flex:1 0 auto;border:1px solid var(--ln);background:none;color:var(--mut);font:inherit;font-size:.85rem;padding:8px;border-radius:999px;cursor:pointer}
.lv button[aria-pressed="true"]{border-color:var(--ac);color:var(--act,var(--ac));font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style><style id="jmpcss">
html{scroll-behavior:smooth}
.jmp{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:8px 2px;margin:6px -2px 0;background:var(--bg);-webkit-overflow-scrolling:touch}
.jmp button{flex:0 0 auto;border:2px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;font-weight:800;font-size:.8rem;border-radius:99px;padding:6px 12px;cursor:pointer;white-space:nowrap}

#fab button{width:46px;height:46px;border-radius:50%;border:2px solid var(--ln);background:var(--sf);color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.18);font-size:1.2rem;cursor:pointer}

<style id="duo">

:root[data-theme="dark"]{--bg:#131F24;--sf:#1F2C34;--ink:#F1F7FB;--mut:#AFAFAF;--ac:#FF5C8A;--acd:#C42550;--acx:#fff;--bad:#FF6B6B;--ln:#37464F}
body{font-family:"Nunito","Be Vietnam Pro",system-ui,sans-serif;font-weight:700}

nav{background:none;border:0;flex-wrap:wrap;overflow:visible;padding:0 0 6px;gap:8px}

.btn,.opt,.card,.lv button,.exb,.st div{border:2px solid var(--ln);border-radius:16px}
.btn{border-bottom-width:4px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;font-size:.9rem}

.lb{flex:1;overflow:auto;max-width:620px;width:100%;margin:0 auto;padding:8px 16px 24px}

.big{font-size:3rem;font-family:"Noto Serif SC","Noto Sans KR",serif;text-align:center;margin:8px 0}
.spk{display:block;margin:6px auto 14px;width:72px;height:72px;border-radius:18px;border:2px solid #84D8FF;border-bottom-width:5px;background:#DDF4FF;font-size:2rem;cursor:pointer}
.opt.sel{background:#DDF4FF;border-color:#84D8FF;color:#1899D6}
.opt small{display:block;color:var(--mut);font-weight:700}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .opt{text-align:center}
.opt.gone{opacity:.35;pointer-events:none}
.lf{border-top:2px solid var(--ln);padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.lf.ok{background:#D7FFB8;color:#58A700}.lf.ok .btn.p{background:#58CC02;border-color:#58A700}.lf.no{background:#FFD6D6;color:#A51212}
.lf>div{max-width:620px;margin:0 auto}
.lf b{display:block;font-size:1.2rem;margin-bottom:10px;font-weight:900}
.lf .btn{width:100%;display:block}.lf .btn:disabled{background:var(--ln);border-color:#B8B8B8;color:#AFAFAF}
.lf.no .btn.p{background:#D61F1F;border-color:#A51212}
.fin{text-align:center;padding-top:40px}.fin .e{font-size:5rem}
.fin .st{margin:20px 0}

.sn-a{min-height:64px;border-bottom:2px solid var(--ln);display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 10px;margin:14px 0}
.sn-b{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sn-a .opt,.sn-b .opt{padding:10px 14px;text-align:center}.sn-b .opt.gone{opacity:.25;pointer-events:none}
.mic{display:block;margin:18px auto 8px;width:84px;height:84px;border-radius:50%;border:0;border-bottom:5px solid var(--acd,#0e5c4d);background:var(--ac);color:#fff;font-size:2rem;cursor:pointer}
.mic.on{animation:pls 1s infinite}@keyframes pls{50%{transform:scale(1.08)}}
.goal{background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:10px 14px;margin:0 0 12px;cursor:pointer}
.goal b{font-size:.9rem}.goal .gb{height:12px;border-radius:8px;background:var(--ln);overflow:hidden;margin-top:6px}.goal .gb i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width .4s}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:99;pointer-events:none;animation:cff 2.4s linear forwards}
@keyframes cff{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.mas{font-size:5rem;display:inline-block;animation:bnc .8s ease infinite alternate}@keyframes bnc{to{transform:translateY(-14px) rotate(-6deg)}}

}

ADD('ko',57,['내일 친구와 약속이 있어요.|Mai tôi có hẹn với bạn.','저는 여행을 좋아해요.|Tôi thích du lịch.','식당을 예약했어요.|Tôi đã đặt nhà hàng.','주말에 쇼핑해요.|Cuối tuần tôi đi mua sắm.','오늘 날씨가 추워요.|Hôm nay trời lạnh.','매일 운동해요.|Tôi tập thể dục mỗi ngày.','제 취미는 음악이에요.|Sở thích của tôi là âm nhạc.','시장에서 과일을 사요.|Tôi mua trái cây ở chợ.','병원에 가야 해요.|Tôi phải đến bệnh viện.','서울은 교통이 편리해요.|Giao thông ở Seoul tiện lợi.','좋은 경험이었어요.|Đó là một trải nghiệm tốt.','한국 문화를 배워요.|Tôi học văn hóa Hàn Quốc.','환경을 보호해야 해요.|Phải bảo vệ môi trường.','건강이 가장 중요해요.|Sức khỏe là quan trọng nhất.','좋은 기회를 놓쳤어요.|Tôi đã bỏ lỡ một cơ hội tốt.','늦은 이유가 뭐예요?|Lý do bạn đến muộn là gì?','친구와 관계가 좋아요.|Quan hệ với bạn rất tốt.','시험을 준비해요.|Tôi chuẩn bị cho kỳ thi.','그는 성격이 좋아요.|Anh ấy tính cách tốt.','어떻게 생각해요?|Bạn nghĩ sao?']);
ADD('ko',107,['오늘은 제 생일이에요.|Hôm nay là sinh nhật tôi.','친구에게 선물을 줬어요.|Tôi đã tặng quà cho bạn.','어머니께 전화했어요.|Tôi đã gọi điện cho mẹ.','음악을 들어요.|Tôi nghe nhạc.','영화를 보러 가요.|Tôi đi xem phim.','일찍 일어나는 습관이 있어요.|Tôi có thói quen dậy sớm.','올해 목표는 한국어예요.|Mục tiêu năm nay là tiếng Hàn.','여행 계획을 세워요.|Tôi lập kế hoạch du lịch.','어릴 때 기억이 나요.|Tôi nhớ chuyện hồi nhỏ.','그는 사업에 성공했어요.|Anh ấy thành công trong kinh doanh.']);

ADD('zh',100,['你有什么爱好？|Nǐ yǒu shénme àihào?|Bạn có sở thích gì?','今天比较冷。|Jīntiān bǐjiào lěng.|Hôm nay khá lạnh.','不要看别人的手机。|Búyào kàn biérén de shǒujī.|Đừng xem điện thoại của người khác.','这里的变化很大。|Zhèlǐ de biànhuà hěn dà.|Nơi này thay đổi rất nhiều.','你能帮忙吗？|Nǐ néng bāngmáng ma?|Bạn giúp một tay được không?','我想参加比赛。|Wǒ xiǎng cānjiā bǐsài.|Tôi muốn tham gia cuộc thi.','他超过我了。|Tā chāoguò wǒ le.|Anh ấy đã vượt qua tôi.','别担心，没问题。|Bié dānxīn, méi wèntí.|Đừng lo, không sao đâu.','这个地方很漂亮。|Zhège dìfang hěn piàoliang.|Nơi này rất đẹp.','我发现钱不见了。|Wǒ fāxiàn qián bújiàn le.|Tôi phát hiện tiền biến mất.','坐地铁很方便。|Zuò dìtiě hěn fāngbiàn.|Đi tàu điện ngầm rất tiện.','你放心吧。|Nǐ fàngxīn ba.|Bạn yên tâm đi.','我感冒了。|Wǒ gǎnmào le.|Tôi bị cảm rồi.','我们的关系很好。|Wǒmen de guānxi hěn hǎo.|Quan hệ của chúng tôi rất tốt.','中国是一个大国家。|Zhōngguó shì yí ge dà guójiā.|Trung Quốc là một quốc gia lớn.','我去过北京。|Wǒ qù guo Běijīng.|Tôi đã từng đến Bắc Kinh.','我害怕黑夜。|Wǒ hàipà hēiyè.|Tôi sợ ban đêm.','他好像很累。|Tā hǎoxiàng hěn lèi.|Anh ấy dường như rất mệt.','这个菜好吃极了。|Zhège cài hǎochī jí le.|Món này ngon cực kỳ.','你还记得我吗？|Nǐ hái jìde wǒ ma?|Bạn còn nhớ tôi không?','老师在讲课。|Lǎoshī zài jiǎngkè.|Giáo viên đang giảng bài.','身体健康最重要。|Shēntǐ jiànkāng zuì zhòngyào.|Sức khỏe là quan trọng nhất.','我喜欢这个电视节目。|Wǒ xǐhuan zhège diànshì jiémù.|Tôi thích chương trình TV này.','这个问题解决了。|Zhège wèntí jiějué le.|Vấn đề này đã được giải quyết.','我决定去中国。|Wǒ juédìng qù Zhōngguó.|Tôi quyết định đi Trung Quốc.','会议几点开始？|Huìyì jǐ diǎn kāishǐ?|Cuộc họp mấy giờ bắt đầu?','我愿意帮你。|Wǒ yuànyì bāng nǐ.|Tôi sẵn lòng giúp bạn.','我习惯早起。|Wǒ xíguàn zǎoqǐ.|Tôi quen dậy sớm.','我需要你的帮助。|Wǒ xūyào nǐ de bāngzhù.|Tôi cần sự giúp đỡ của bạn.','请注意安全。|Qǐng zhùyì ānquán.|Xin chú ý an toàn.','我在准备考试。|Wǒ zài zhǔnbèi kǎoshì.|Tôi đang chuẩn bị thi.','电影结束了。|Diànyǐng jiéshù le.|Phim đã kết thúc.','不好意思，麻烦你了。|Bù hǎoyìsi, máfan nǐ le.|Ngại quá, làm phiền bạn rồi.','我对这里很满意。|Wǒ duì zhèlǐ hěn mǎnyì.|Tôi rất hài lòng với nơi này.','她看起来很年轻。|Tā kàn qǐlái hěn nián ADD('zh',150,['我保证按时完成。|Wǒ bǎozhèng ànshí wánchéng.|Tôi đảm bảo hoàn thành đúng hạn.','这部分很难。|Zhè bùfen hěn nán.|Phần này rất khó.','我本来想去，后来没去。|Wǒ běnlái xiǎng qù, hòulái méi qù.|Vốn dĩ tôi định đi nhưng sau đó không đi.','他表示同意。|Tā biǎoshì tóngyì.|Anh ấy bày tỏ sự đồng ý.','我们参观了博物馆。|Wǒmen cānguān le bówùguǎn.|Chúng tôi đã tham quan bảo tàng.','请注意这篇文章的重点。|Qǐng zhùyì zhè piān wénzhāng de zhòngdiǎn.|Hãy chú ý trọng điểm của bài này.','你打算什么时候走？|Nǐ dǎsuàn shénme shíhou zǒu?|Bạn định khi nào đi?','这个问题很复杂。|Zhège wèntí hěn fùzá.|Vấn đề này rất phức tạp.','这本书的作者是谁？|Zhè běn shū de zuòzhě shì shéi?|Tác giả cuốn sách này là ai?','他经历过很多困难。|Tā jīnglì guo hěn duō kùnnan.|Anh ấy đã trải qua nhiều khó khăn.','请按照说明做。|Qǐng ànzhào shuōmíng zuò.|Xin làm theo hướng dẫn.','请保持安静。|Qǐng bǎochí ānjìng.|Xin giữ yên lặng.','我们要避免犯错。|Wǒmen yào bìmiǎn fàn cuò.|Chúng ta phải tránh mắc lỗi.','他承认自己错了。|Tā chéngrèn zìjǐ cuò le.|Anh ấy thừa nhận mình sai.','他创造了新的方法。|Tā chuàngzào le xīn de fāngfǎ.|Anh ấy đã sáng tạo ra phương pháp mới.','他代表公司发言。|Tā dàibiǎo gōngsī fāyán.|Anh ấy phát biểu thay mặt công ty.','这个问题反映了社会现实。|Zhège wèntí fǎnyìng le shèhuì xiànshí.|Vấn đề này phản ánh thực tế xã hội.','我们要采取行动。|Wǒmen yào cǎiqǔ xíngdòng.|Chúng ta phải hành động.','他积累了很多经验。|Tā jīlěi le hěn duō jīngyàn.|Anh ấy đã tích lũy nhiều kinh nghiệm.','这本书吸引了我。|Zhè běn shū xīyǐn le wǒ.|Cuốn sách này thu hút tôi.','法律保障我们的权利。|Fǎlǜ bǎozhàng wǒmen de quánlì.|Pháp luật bảo vệ quyền lợi của chúng ta.','要看清问题的本质。|Yào kànqīng wèntí de běnzhì.|Cần nhìn rõ bản chất của vấn đề.','这是一个新趋势。|Zhè shì yí ge xīn qūshì.|Đây là một xu hướng mới.','他对食物很挑剔。|Tā duì shíwù hěn tiāotī.|Anh ấy rất kén ăn.','他们之间有矛盾。|Tāmen zhījiān yǒu máodùn.|Giữa họ có mâu thuẫn.','我们要消除偏见。|Wǒmen yào xiāochú piānjiàn.|Chúng ta cần xóa bỏ định kiến.','这个概念很抽象。|Zhège gàiniàn hěn chōuxiàng.|Khái niệm này rất trừu tượng.','他的观念很传统。|Tā de guānniàn hěn chuántǒng.|Quan niệm của ông ấy rất truyền thống.','这是一个难得的机遇。|Zhè shì yí ge nándé de jīyù.|Đây là một cơ const GR={"zh": [["Câu cơ bản: Chủ ngữ + Động từ + Tân ngữ", "Thứ tự giống tiếng Việt: ai + làm gì + cái gì.", "我喝茶。~Wǒ hē chá.~Tôi uống trà.|他学习中文。~Tā xuéxí Zhōngwén.~Anh ấy học tiếng Trung."], ["Phủ định: 不 và 没", "不 phủ định ý muốn, thói quen, hiện tại. 没 (有) phủ định việc đã xảy ra hoặc phủ định 有.", "我不喝咖啡。~Wǒ bù hē kāfēi.~Tôi không uống cà phê.|我没吃饭。~Wǒ méi chīfàn.~Tôi chưa ăn cơm."], ["Câu hỏi có/không với 吗", "Thêm 吗 vào cuối câu trần thuật để biến thành câu hỏi có/không.", "你是学生吗？~Nǐ shì xuésheng ma?~Bạn là học sinh à?|你喜欢茶吗？~Nǐ xǐhuan chá ma?~Bạn có thích trà không?"], ["Lượng từ", "Số + lượng từ + danh từ. 个 là lượng từ dùng chung, mỗi loại vật còn có lượng từ riêng.", "三个人~Sān ge rén~Ba người|一杯水~Yì bēi shuǐ~Một cốc nước"], ["Trợ từ 了", "Đặt sau động từ để báo hành động đã hoàn thành, hoặc cuối câu để báo sự thay đổi.", "我买了书。~Wǒ mǎi le shū.~Tôi đã mua sách.|下雨了。~Xià yǔ le.~Trời mưa rồi."], ["Giới từ 在 (ở, tại)", "Cấu trúc: 在 + nơi chốn + động từ, nơi chốn đứng trước động từ.", "我在家看书。~Wǒ zài jiā kàn shū.~Tôi đọc sách ở nhà.|她在医院工作。~Tā zài yīyuàn gōngzuò.~Cô ấy làm việc ở bệnh viện."]], "ko": [["Thứ tự câu: Chủ ngữ - Tân ngữ - Động từ", "Động từ luôn đứng cuối câu, khác tiếng Việt.", "저는 밥을 먹어요.~Tôi ăn cơm.|친구가 책을 읽어요.~Bạn đọc sách."], ["Trợ từ 은/는 và 이/가", "은/는 đánh dấu chủ đề của câu. 이/가 đánh dấu chủ ngữ. Dùng 은/이 sau phụ âm cuối, 는/가 sau nguyên âm.", "저는 학생이에요.~Tôi là học sinh.|날씨가 좋아요.~Thời tiết đẹp."], ["Trợ từ tân ngữ 을/를", "Đứng sau tân ngữ. Dùng 을 sau phụ âm cuối, 를 sau nguyên âm.", "커피를 마셔요.~Tôi uống cà phê.|물을 마셔요.~Tôi uống nước."], ["Đuôi lịch sự -아요/-어요", "Thêm vào gốc động từ để nói lịch sự thông thường. Gốc có ㅏ hoặc ㅗ dùng -아요, còn lại dùng -어요.", "가요~Tôi đi.|먹어요~Tôi ăn."], ["Phủ định 안 và -지 않다", "Đặt 안 trước động từ, hoặc thêm -지 않아요 sau gốc động từ.", "안 가요.~Tôi không đi.|숙제를 안 해요.~Tôi không làm bài tập."], ["Trợ từ nơi chốn 에 và 에서", "에 dùng với đích đến hoặc nơi tồn tại. 에서 dùng cho nơi diễn ra hành động.", "학교에 가요.~Tôi đến trường.|도서관에서 공부해요.~Tôi học ở thư viện."]], "en": [["Thứ tự câu: Chủ ngữ + Động từ + Tân ngữ", "Giống tiếng Việt: ai + làm gì + cái gì.", "I eat rice.~Tôi ăn cơm.|She reads a book.~Cô ấy đọc sách."], ["Hiện tại đơn", "Dùng cho thói quen và sự thật. Với he/she/it, động từ thêm -s.", "He works here.~Anh ấy làm việc ở đây.|They work here.~Họ làm việc ở đây."], ["Hiện tại tiếp diễn", "Cấu trúc am/is/are + V-ing, nói về việc đang diễn ra.", "I am studying.~Tôi đang học.|She is cooking.~Cô ấy đang nấu ăn."], ["Quá khứ đơn", "Động từ có quy tắc thêm -ed, nhiều động từ thường dùng là bất quy tắc.", "I visited Hanoi.~Tôi đã thăm Hà Nội.|We went home.~Chúng tôi đã về nhà."], ["Mạo từ a, an, the", "a trước âm phụ âm, an trước nguyên âm, the khi nói về vật đã xác định.", "a book, an apple~Một quyển sách, một quả táo|The sun is hot.~Mặt trời nóng."], ["Phủ định và câu hỏi với do/does", "Dùng do/does + not để phủ định, đưa do/does lên đầu để hỏi.", "I do not like coffee.~Tôi không thích cà phê.|Do you like tea?~Bạn có thích trà không?"]]},DLG={"zh": [["Chào hỏi", ["你好！你叫什么名字？~Nǐ hǎo! Nǐ jiào shénme míngzi?~Xin chào! Bạn tên là gì?", "我叫小明。你呢？~Wǒ jiào Xiǎomíng. Nǐ ne?~Tôi tên Tiểu Minh. Còn bạn?", "我叫小红。认识你很高兴。~Wǒ jiào Xiǎohóng. Rènshi nǐ hěn gāoxìng.~Tôi tên Tiểu Hồng. Rất vui được biết bạn.", "我也很高兴。~Wǒ yě hěn gāoxìng.~Tôi cũng rất vui."]], ["Mua đồ", ["你好，这个多少钱？~Nǐ hǎo, zhège duōshao qián?~Chào bạn, cái này bao nhiêu tiền?", "二十块。~Èrshí kuài.~Hai mươi tệ.", "太贵了，便宜一点吧。~Tài guì le, piányi yìdiǎn ba.~Đắt quá, rẻ chút đi.", "好的，十五块。~Hǎo de, shíwǔ kuài.~Được, mười lăm tệ."]], ["Hỏi đường", ["请问，医院在哪里？~Qǐngwèn, yīyuàn zài nǎlǐ?~Xin hỏi, bệnh viện ở đâu?", "一直走，然后左转。~Yìzhí zǒu, ránhòu zuǒ zhuǎn.~Đi thẳng, sau đó rẽ trái.", "远吗？~Yuǎn ma?~Xa không?", "不远，走五分钟就到。~Bù yuǎn, zǒu wǔ fēnzhōng jiù dào.~Không xa, đi năm phút là tới."]]], "ko": [["Chào hỏi", ["안녕하세요. 이름이 뭐예요?~Xin chào. Tên bạn là gì?", "저는 민수예요. 이름이 뭐예요?~Tôi là Minsu. Tên bạn là gì?", "저는 지민이에요. 만나서 반가워요.~Tôi là Jimin. Rất vui được gặp.", "저도 반가워요.~Tôi cũng rất vui."]], ["Mua đồ", ["이거 얼마예요?~Cái này bao nhiêu tiền?", "이만 원이에요.~Hai vạn won.", "너무 비싸요. 깎아 주세요.~Đắt quá. Giảm giá cho tôi.", "알겠어요. 만팔천 원에 드릴게요.~Được rồi. Tôi bán mười tám nghìn won."]], ["Nhà hàng", ["메뉴 좀 주세요.~Cho tôi xem thực đơn.", "네, 여기 있어요.~Vâng, đây ạ.", "김치찌개 하나 주세요.~Cho tôi một phần canh kim chi.", "네, 잠시만 기다리세요.~Vâng, xin chờ một chút."]]], "en": [["Chào hỏi", ["Hi, what is your name?~Xin chào, tên bạn là gì?", "My name is Anna. And you?~Tôi tên Anna. Còn bạn?", "I am Tom. Nice to meet you.~Tôi là Tom. Rất vui được gặp bạn.", "Nice to meet you too.~Tôi cũng rất vui."]], ["Nhà hàng", ["Can I see the menu, please?~Cho tôi xem thực đơn được không?", "Sure, here you are.~Vâng, của bạn đây.", "I would like a coffee and a sandwich.~Tôi muốn một cà phê và một bánh sandwich.", "Of course. Anything else?~Tất nhiên. Còn gì nữa không?"]], ["Hỏi đường", ["Excuse me, where is the station?~Xin lỗi, nhà ga ở đâu?", "Go straight and turn left.~Đi thẳng rồi rẽ trái.", "Is it far?~Có xa không?", "No, it is five minutes on foot.~Không, đi bộ năm phút."]]]};
DLG.zh.push(...[["Ở quán ăn", ["你好，请问几位？~Nǐ hǎo, qǐngwèn jǐ wèi?~Xin chào, cho hỏi mấy người ạ?", "两位。有靠窗的位子吗？~Liǎng wèi. Yǒu kào chuāng de wèizi ma?~Hai người. Có chỗ ngồi cạnh cửa sổ không?", "有，这边请。这是菜单。~Yǒu, zhè biān qǐng. Zhè shì càidān.~Có, mời đi lối này. Đây là thực đơn.", "我要一碗牛肉面，不要辣。~Wǒ yào yì wǎn niúròu miàn, bú yào là.~Tôi muốn một tô mì bò, không cay.", "请再来一杯热茶。~Qǐng zài lái yì bēi rè chá.~Cho thêm một ly trà nóng.", "服务员，买单。~Fúwùyuán, mǎidān.~Phục vụ ơi, tính tiền."]], ["Đi khám bệnh", ["医生，我头疼，还有点发烧。~Yīshēng, wǒ tóuténg, hái yǒudiǎn fāshāo.~Bác sĩ, tôi đau đầu, còn hơi sốt.", "从什么时候开始的？~Cóng shénme shíhou kāishǐ de?~Bắt đầu từ khi nào?", "从昨天晚上开始的。~Cóng zuótiān wǎnshang kāishǐ de.~Từ tối hôm qua.", "别担心，只是感冒。~Bié dānxīn, zhǐshì gǎnmào.~Đừng lo, chỉ là cảm thôi.", "这个药一天吃几次？~Zhège yào yì tiān chī jǐ cì?~Thuốc này một ngày uống mấy lần?", "一天三次，饭后吃。多喝水，好好休息。~Yì tiān sān cì, fàn hòu chī. Duō hē shuǐ, hǎohāo xiūxi.~Một ngày ba lần, uống sau bữa ăn. Uống nhiều nước, nghỉ ngơi cho tốt."]], ["Đi taxi", ["师傅，去火车站。~Shīfu, qù huǒchēzhàn.~Bác tài, đến ga tàu.", "好的。大概二十分钟。~Hǎo de. Dàgài èrshí fēnzhōng.~Được. Khoảng hai mươi phút.", "能快一点吗？我赶时间。~Néng kuài yìdiǎn ma? Wǒ gǎn shíjiān.~Nhanh hơn một chút được không? Tôi đang vội.", "现在堵车，我尽量。~Xiànzài dǔchē, wǒ jǐnliàng.~Bây giờ đang kẹt xe, tôi sẽ cố hết sức.", "就在前面停吧。多少钱？~Jiù zài qiánmiàn tíng ba. Duōshao qián?~Dừng ngay phía trước nhé. Bao nhiêu tiền?", "三十五块。~Sānshí wǔ kuài.~Ba mươi lăm tệ."]], ["Nói về gia đình", ["你家有几口人？~Nǐ jiā yǒu jǐ kǒu rén?~Nhà bạn có mấy người?", "我家有五口人：爸爸、妈妈、哥哥、我和妹妹。~Wǒ jiā yǒu wǔ kǒu rén: bàba, māma, gēge, wǒ hé mèimei.~Nhà tôi có năm người: bố, mẹ, anh trai, tôi và em gái.", "你爸爸妈妈做什么工作？~Nǐ bàba māma zuò shénme gōngzuò?~Bố mẹ bạn làm nghề gì?", "我爸爸是老师，我妈妈是护士。~Wǒ bàba shì lǎoshī, wǒ māma shì hùshi.~Bố tôi là giáo viên, mẹ tôi là y tá.", "你们住在一起吗？~Nǐmen zhù zài yìqǐ ma?~Mọi người sống cùng nhau không?", "对，周末我们常常一起吃饭。~Duì, zhōumò wǒmen chángcháng yìqǐ chīfàn.~Đúng, cuối tuần chúng tôi thường ăn cơm cùng nhau."]], ["Hẹn bạn đi chơi", ["这个周末你有空吗？~Zhège zhōumò nǐ yǒu kòng ma?~Cuối tuần này bạn rảnh không?", "有空，有什么事吗？~Yǒu kòng, yǒu shénme shì ma?~Rảnh, có chuyện gì thế?", "我们去看电影吧。~Wǒmen qù kàn diànyǐng ba.~Chúng ta đi xem phim nhé.", "好啊，几点见面？~Hǎo a, jǐ diǎn jiànmiàn?~Được chứ, mấy giờ gặp?", "下午三点，在电影院门口。~Xiàwǔ sān diǎn, zài diànyǐngyuàn ménkǒu.~Ba giờ chiều, ở cửa rạp chiếu phim.", "好，不见不散！~Hǎo, bú jiàn bú sàn!~Được, không gặp không về!"]], ["Mua quần áo", ["这件衣服有大一点的吗？~Zhè jiàn yīfu yǒu dà yìdiǎn de ma?~Cái áo này có cỡ lớn hơn không?", "有，你想试试吗？~Yǒu, nǐ xiǎng shìshi ma?~Có, bạn muốn thử không?", "试衣间在哪儿？~Shìyījiān zài nǎr?~Phòng thử đồ ở đâu?", "在那边。~Zài nàbiān.~Ở bên kia.", "这件很合适，可以打折吗？~Zhè jiàn hěn héshì, kěyǐ dǎzhé ma?~Cái này rất vừa, có giảm giá được không?", "可以，打八折，可以刷卡。~Kěyǐ, dǎ bā zhé, kěyǐ shuākǎ.~Được, giảm 20%, có thể quẹt thẻ."]], ["Gọi điện thoại", ["喂，请问小李在吗？~Wéi, qǐngwèn Xiǎo Lǐ zài ma?~A lô, cho hỏi Tiểu Lý có ở đó không?", "他不在，你是哪位？~Tā bú zài, nǐ shì nǎ wèi?~Anh ấy không có, bạn là ai?", "我是他同事，我姓王。~Wǒ shì tā tóngshì, wǒ xìng Wáng.~Tôi là đồng nghiệp của anh ấy, tôi họ Vương.", "需要我转告他什么吗？~Xūyào wǒ zhuǎngào tā shénme ma?~Cần tôi nhắn lại gì cho anh ấy không?", "请让他回我电话。~Qǐng ràng tā huí wǒ diànhuà.~Xin bảo anh ấy gọi lại cho tôi.", "好的，没问题。~Hǎo de, méi wèntí.~Được, không vấn đề."]], ["Thời tiết và giờ giấc", ["今天天气怎么样？~Jīntiān tiānqì zěnmeyàng?~Hôm nay thời tiết thế nào?", "有点冷，可能会下雨。~Yǒudiǎn lěng, kěnéng huì xiàyǔ.~Hơi lạnh, có thể sẽ mưa.", "现在几点了？~Xiànzài jǐ diǎn le?~Bây giờ mấy giờ rồi?", "差五分八点。~Chà wǔ fēn bā diǎn.~Còn năm phút nữa là tám giờ.", "糟糕，我要迟到了！~Zāogāo, wǒ yào chídào le!~Chết rồi, tôi sắp trễ rồi!", "带上伞，路上小心。~Dài shàng sǎn, lùshang xiǎoxīn.~Mang theo ô, đi đường cẩn thận."]]]);DLG.ko.push(...[["Quán cà phê", ["어서 오세요. 주문하시겠어요?~Xin chào quý khách. Quý khách gọi món nhé?", "아이스 아메리카노 한 잔 주세요.~Cho tôi một ly Americano đá.", "사이즈는 어떻게 하시겠어요?~Quý khách muốn cỡ nào?", "큰 걸로 주세요.~Cho tôi cỡ lớn.", "여기서 드실 거예요, 가져가실 거예요?~Quý khách dùng tại đây hay mang đi?", "가져갈게요. 카드로 계산할게요.~Tôi mang đi. Tôi thanh toán bằng thẻ."]], ["Đi khám bệnh", ["어디가 아프세요?~Bạn đau ở đâu?", "머리가 아프고 열이 나요.~Tôi đau đầu và bị sốt.", "언제부터 그랬어요?~Bị từ khi nào?", "어제 저녁부터요.~Từ tối hôm qua.", "감기예요. 약을 처방해 드릴게요.~Là cảm cúm. Tôi sẽ kê thuốc cho bạn.", "하루에 세 번, 식사 후에 드세요.~Uống ngày ba lần, sau bữa ăn."]], ["Đi taxi", ["어디로 가시나요?~Quý khách đi đâu ạ?", "서울역으로 가 주세요.~Cho tôi đến ga Seoul.", "시간이 얼마나 걸려요?~Mất bao lâu?", "길이 막히면 삼십 분쯤 걸려요.~Nếu kẹt xe thì mất khoảng ba mươi phút.", "여기서 세워 주세요.~Dừng ở đây giúp tôi.", "이만 이천 원입니다.~Hai mươi hai nghìn won ạ."]], ["Nói về gia đình", ["가족이 몇 명이에요?~Gia đình bạn có mấy người?", "다섯 명이에요. 부모님, 형, 저, 여동생이 있어요.~Có năm người. Có bố mẹ, anh trai, tôi và em gái.", "부모님은 무슨 일을 하세요?~Bố mẹ bạn làm nghề gì?", "아버지는 선생님이시고 어머니는 간호사예요.~Bố tôi là giáo viên còn mẹ tôi là y tá.", "다 같이 사세요?~Mọi người sống cùng nhau à?", "네, 주말에는 같이 밥을 먹어요.~Vâng, cuối tuần chúng tôi ăn cơm cùng nhau."]], ["Hẹn bạn đi chơi", ["이번 주말에 시간 있어요?~Cuối tuần này bạn có rảnh không?", "네, 있어요. 왜요?~Vâng, có. Có chuyện gì?", "같이 영화 볼래요?~Cùng xem phim không?", "좋아요. 몇 시에 만날까요?~Hay đấy. Mấy giờ mình gặp?", "오후 세 시에 영화관 앞에서 만나요.~Gặp nhau lúc ba giờ chiều trước rạp chiếu phim nhé.", "알겠어요. 그때 봐요!~Được rồi. Hẹn gặp lúc đó!"]], ["Mua quần áo", ["이 옷 좀 입어 봐도 돼요?~Tôi mặc thử bộ này được không?", "네, 탈의실은 저쪽이에요.~Vâng, phòng thử đồ ở phía kia.", "조금 작아요. 더 큰 사이즈 있어요?~Hơi nhỏ. Có cỡ lớn hơn không?", "잠시만요. 확인해 볼게요.~Xin chờ chút. Tôi sẽ kiểm tra.", "이거 할인돼요?~Cái này có được giảm giá không?", "지금 이십 퍼센트 할인 중이에요.~Hiện đang giảm hai mươi phần trăm."]], ["Gọi điện thoại", ["여보세요, 김 선생님 계세요?~A lô, thầy Kim có ở đó không ạ?", "지금 안 계세요. 누구세요?~Hiện giờ không có. Bạn là ai?", "저는 같은 회사 직원이에요.~Tôi là nhân viên cùng công ty.", "전할 말씀 있으세요?~Bạn có lời nhắn gì không?", "전화해 달라고 전해 주세요.~Xin nhắn họ gọi lại cho tôi.", "네, 알겠습니다.~Vâng, tôi hiểu rồi."]], ["Thời tiết và giờ giấc", ["오늘 날씨가 어때요?~Hôm nay thời tiết thế nào?", "좀 춥고 비가 올 것 같아요.~Hơi lạnh và có vẻ sắp mưa.", "지금 몇 시예요?~Bây giờ là mấy giờ?", "여덟 시 오 분 전이에요.~Còn năm phút nữa là tám giờ.", "큰일 났다! 늦겠어요.~Chết rồi! Tôi sắp trễ mất.", "우산 챙기고 조심해서 가세요.~Mang theo ô và đi cẩn thận nhé."]], ["Đi tàu điện ngầm", ["이 지하철이 강남역에 가요?~Tàu điện này có đến ga Gangnam không?", "아니요, 반대편에서 타세요.~Không, hãy lên ở phía đối diện.", "어디에서 갈아타야 해요?~Tôi phải đổi tàu ở đâu?", "서울역에서 2호선으로 갈아타세요.~Hãy đổi sang tuyến 2 ở ga Seoul.", "교통카드는 어디서 살 수 있어요?~Mua thẻ giao thông ở đâu được?", "편의점에서 살 수 있어요.~Bạn có thể mua ở cửa hàng tiện lợi."]]]);DLG.en.push(...[["Quán cà phê", ["Hi, what can I get for you?~Xin chào, tôi có thể lấy gì cho bạn?", "Can I have a large iced latte, please?~Cho tôi một ly latte đá cỡ lớn.", "Would you like anything to eat?~Bạn có muốn ăn gì không?", "Just a croissant. How much is that?~Chỉ một bánh sừng bò. Hết bao nhiêu?", "That will be seven dollars.~Hết bảy đô la.", "Can I pay by card?~Tôi trả bằng thẻ được không?"]], ["Đi khám bệnh", ["What seems to be the problem?~Bạn bị làm sao vậy?", "I have a headache and a fever.~Tôi bị đau đầu và sốt.", "How long have you felt like this?~Bạn bị như vậy bao lâu rồi?", "Since last night.~Từ tối qua.", "It is just a cold. Take this medicine twice a day.~Chỉ là cảm lạnh. Uống thuốc này hai lần mỗi ngày.", "Thank you, doctor. I will rest at home.~Cảm ơn bác sĩ. Tôi sẽ nghỉ ngơi ở nhà."]], ["Đi taxi", ["Where to, please?~Bạn đi đâu ạ?", "To the airport, please.~Làm ơn cho tôi ra sân bay.", "How long will it take?~Mất bao lâu?", "About thirty minutes if there is no traffic.~Khoảng ba mươi phút nếu không kẹt xe.", "Could you go a little faster? I am in a hurry.~Bạn đi nhanh hơn một chút được không? Tôi đang vội.", "Sure. Here we are. That is twenty dollars.~Được. Đến nơi rồi. Hai mươi đô la."]], ["Nói về gia đình", ["How many people are in your family?~Gia đình bạn có mấy người?", "There are five of us: my parents, my brother, my sister and me.~Nhà tôi có năm người: bố mẹ, anh trai, chị gái và tôi.", "What do your parents do?~Bố mẹ bạn làm nghề gì?", "My father is a teacher and my mother is a nurse.~Bố tôi là giáo viên và mẹ tôi là y tá.", "Do you live together?~Mọi người sống cùng nhau không?", "Yes, and we have dinner together every weekend.~Có, và cuối tuần nào chúng tôi cũng ăn tối cùng nhau."]], ["Hẹn bạn đi chơi", ["Are you free this weekend?~Cuối tuần này bạn rảnh không?", "Yes, why?~Có, sao thế?", "Do you want to go to the movies?~Bạn muốn đi xem phim không?", "Sounds great. What time shall we meet?~Nghe hay đấy. Mấy giờ mình gặp nhau?", "Let us meet at three in front of the cinema.~Mình gặp lúc ba giờ trước rạp chiếu phim nhé.", "Perfect. See you then!~Tuyệt. Hẹn gặp lúc đó!"]], ["Mua quần áo", ["Excuse me, do you have this in a larger size?~Xin lỗi, cái này có cỡ lớn hơn không?", "Let me check. Would you like to try it on?~Để tôi kiểm tra. Bạn có muốn thử không?", "Yes, where is the fitting room?~Có, phòng thử đồ ở đâu?", "It is over there, on the left.~Ở đằng kia, bên trái.", "It fits well. Is there a discount?~Vừa lắm. Có giảm giá không?", "Yes, it is twenty percent off today.~Có, hôm nay giảm hai mươi phần trăm."]], ["Gọi điện thoại", ["Hello, may I speak to Mr. Smith?~A lô, cho tôi nói chuyện với ông Smith được không?", "He is not here right now. Who is calling?~Hiện ông ấy không có đây. Ai đang gọi vậy?", "This is Linh from the sales department.~Tôi là Linh ở phòng kinh doanh.", "Would you like to leave a message?~Bạn có muốn để lại lời nhắn không?", "Please ask him to call me back.~Làm ơn nhắn ông ấy gọi lại cho tôi.", "Of course. I will tell him.~Tất nhiên. Tôi sẽ nói với ông ấy."]], ["Thời tiết và giờ giấc", ["What is the weather like today?~Hôm nay thời tiết thế nào?", "It is cold and it might rain.~Trời lạnh và có thể sẽ mưa.", "What time is it now?~Bây giờ là mấy giờ?", "It is five to eight.~Còn năm phút nữa là tám giờ.", "Oh no, I am going to be late!~Ôi không, tôi sắp trễ rồi!", "Take an umbrella and be careful.~Mang theo ô và đi cẩn thận nhé."]], ["Nhận phòng khách sạn", ["Hello, I have a reservation under the name Nam.~Xin chào, tôi có đặt phòng dưới tên Nam.", "Yes, a room for two nights. May I see your passport?~Vâng, một phòng hai đêm. Cho tôi xem hộ chiếu được không?", "Here you go. Is breakfast included?~Của bạn đây. Có gồm bữa sáng không?", "Yes, from seven to ten in the morning.~Có, từ bảy đến mười giờ sáng.", "What time is check-out?~Mấy giờ trả phòng?", "Check-out is at noon. Enjoy your stay.~Trả phòng lúc mười hai giờ trưa. Chúc bạn lưu trú vui vẻ."]], ["Ở chỗ làm", ["Good morning. Do you have a minute?~Chào buổi sáng. Bạn có chút thời gian không?", "Sure. What is it about?~Được chứ. Về việc gì vậy?", "I need your help with this report.~Tôi cần bạn giúp với bản báo cáo này.", "When is the deadline?~Hạn chót là khi nào?", "It is due on Friday afternoon.~Hạn là chiều thứ Sáu.", "No problem. Let us go over it together.~Không vấn đề. Cùng xem lại nó nhé."]]]);
(function(X){for(const l in X)for(const k in X[l]){const d=DLG[l].find(x=>x[0]===k);if(d)d[1].push(...X[l][k])}})({"zh": {"Chào hỏi": ["你是哪国人？~Nǐ shì nǎ guó rén?~Bạn là người nước nào?", "我是越南人，你呢？~Wǒ shì Yuènán rén, nǐ ne?~Tôi là người Việt Nam, còn bạn?", "我是中国人，住在北京。~Wǒ shì Zhōngguó rén, zhù zài Běijīng.~Tôi là người Trung Quốc, sống ở Bắc Kinh.", "我正在学中文，你能教我吗？~Wǒ zhèngzài xué Zhōngwén, nǐ néng jiāo wǒ ma?~Tôi đang học tiếng Trung, bạn dạy tôi được không?", "当然可以！你说得很好。~Dāngrán kěyǐ! Nǐ shuō de hěn hǎo.~Tất nhiên được! Bạn nói rất tốt.", "谢谢，请多关照！~Xièxie, qǐng duō guānzhào!~Cảm ơn, mong được giúp đỡ nhiều!"], "Mua đồ": ["我要两个，可以再便宜一点吗？~Wǒ yào liǎng ge, kěyǐ zài piányi yìdiǎn ma?~Tôi mua hai cái, có thể rẻ thêm chút không?", "两个二十八块，不能再少了。~Liǎng ge èrshí bā kuài, bù néng zài shǎo le.~Hai cái hai mươi tám tệ, không bớt thêm được nữa.", "好吧，给你一百块。~Hǎo ba, gěi nǐ yìbǎi kuài.~Được thôi, đưa bạn một trăm tệ.", "找你七十二块。要袋子吗？~Zhǎo nǐ qīshí èr kuài. Yào dàizi ma?~Thối lại bạn bảy mươi hai tệ. Bạn có cần túi không?", "要一个，谢谢。~Yào yí ge, xièxie.~Cho một cái, cảm ơn.", "慢走，欢迎再来！~Màn zǒu, huānyíng zài lái!~Đi cẩn thận nhé, hoan nghênh lại ghé!"], "Hỏi đường": ["请问，要过马路吗？~Qǐngwèn, yào guò mǎlù ma?~Xin hỏi, có phải băng qua đường không?", "要，前面有个红绿灯，过了马路就是。~Yào, qiánmiàn yǒu ge hónglǜdēng, guò le mǎlù jiù shì.~Có, phía trước có đèn giao thông, qua đường là tới.", "医院旁边有什么？~Yīyuàn pángbiān yǒu shénme?~Bên cạnh bệnh viện có gì?", "旁边有一家药店和一个银行。~Pángbiān yǒu yì jiā yàodiàn hé yí ge yínháng.~Bên cạnh có một hiệu thuốc và một ngân hàng.", "太好了，非常感谢！~Tài hǎo le, fēicháng gǎnxiè!~Tuyệt quá, cảm ơn bạn nhiều!", "不客气。~Bú kèqi.~Không có gì."], "Ở quán ăn": ["好的，一共六十八块。~Hǎo de, yígòng liùshí bā kuài.~Vâng, tổng cộng sáu mươi tám tệ.", "可以用微信支付吗？~Kěyǐ yòng Wēixìn zhīfù ma?~Có thể thanh toán bằng WeChat không?", "可以，请扫这个二维码。~Kěyǐ, qǐng sǎo zhège èrwéimǎ.~Được, mời quét mã QR này.", "扫好了。面条很好吃！~Sǎo hǎo le. Miàntiáo hěn hǎochī!~Quét xong rồi. Mì rất ngon!", "谢谢夸奖！需要发票吗？~Xièxie kuājiǎng! Xūyào fāpiào ma?~Cảm ơn bạn đã khen! Cần hóa đơn không?", "不用了，谢谢。下次再来！~Bú yòng le, xièxie. Xià cì zài lái!~Không cần, cảm ơn. Lần sau tôi lại đến!"], "Đi khám bệnh": ["我需要请假吗？~Wǒ xūyào qǐngjià ma?~Tôi có cần xin nghỉ không?", "最好在家休息两天。我给你开张证明。~Zuì hǎo zài jiā xiūxi liǎng tiān. Wǒ gěi nǐ kāi zhāng zhèngmíng.~Tốt nhất nên nghỉ ở nhà hai ngày. Tôi sẽ viết giấy xác nhận cho bạn.", "我对青霉素过敏，这个药可以吗？~Wǒ duì qīngméisù guòmǐn, zhège yào kěyǐ ma?~Tôi dị ứng penicillin, thuốc này có dùng được không?", "谢谢你告诉我，这个药没有青霉素。~Xièxie nǐ gàosu wǒ, zhège yào méiyǒu qīngméisù.~Cảm ơn bạn đã báo, thuốc này không có penicillin.", "如果三天后还不好怎么办？~Rúguǒ sān tiān hòu hái bù hǎo zěnme bàn?~Nếu ba ngày sau vẫn chưa khỏi thì sao?", "那你再来复诊，我们做个检查。~Nà nǐ zài lái fùzhěn, wǒmen zuò ge jiǎnchá.~Vậy bạn quay lại tái khám, chúng tôi sẽ làm xét nghiệm."], "Đi taxi": ["我可以用手机付款吗？~Wǒ kěyǐ yòng shǒujī fùkuǎn ma?~Tôi có thể thanh toán bằng điện thoại không?", "可以，扫这个码就行。~Kěyǐ, sǎo zhège mǎ jiù xíng.~Được, quét mã này là xong.", "请给我一张发票。~Qǐng gěi wǒ yì zhāng fāpiào.~Làm ơn cho tôi một tờ hóa đơn.", "好的，稍等。你的行李别忘了。~Hǎo de, shāo děng. Nǐ de xíngli bié wàng le.~Vâng, đợi chút. Đừng quên hành lý của bạn.", "谢谢，一路辛苦了。~Xièxie, yílù xīnkǔ le.~Cảm ơn, bác lái xe vất vả rồi.", "不客气，祝你旅途愉快！~Bú kèqi, zhù nǐ lǚtú yúkuài!~Không có gì, chúc bạn chuyến đi vui vẻ!"], "Nói về gia đình": ["你哥哥多大了？~Nǐ gēge duō dà le?~Anh trai bạn bao nhiêu tuổi rồi?", "他二十八岁，已经结婚了。~Tā èrshí bā suì, yǐjīng jiéhūn le.~Anh ấy hai mươi tám tuổi, đã kết hôn rồi.", "那你妹妹呢？她上学吗？~Nà nǐ mèimei ne? Tā shàngxué ma?~Thế còn em gái bạn? Em ấy còn đi học không?", "对，她今年上高中。~Duì, tā jīnnián shàng gāozhōng.~Đúng, năm nay em ấy học cấp ba.", "你们家有宠物吗？~Nǐmen jiā yǒu chǒngwù ma?~Nhà bạn có thú cưng không?", "有一只小狗，它很可爱。~Yǒu yì zhī xiǎo gǒu, tā hěn kě'ài.~Có một chú chó nhỏ, nó rất đáng yêu."], "Hẹn bạn đi chơi": ["对了，你想先吃饭还是先看电影？~Duì le, nǐ xiǎng xiān chīfàn háishi xiān kàn diànyǐng?~À này, bạn muốn ăn trước hay xem phim trước?", "先吃饭吧，我有点饿了。~Xiān chīfàn ba, wǒ yǒudiǎn è le.~Ăn trước đi, tôi hơi đói rồi.", "那我们两点半在地铁站见。~Nà wǒmen liǎng diǎn bàn zài dìtiězhàn jiàn.~Vậy chúng ta gặp ở ga tàu điện ngầm lúc hai giờ rưỡi.", "可以，我坐地铁去，不会迟到。~Kěyǐ, wǒ zuò dìtiě qù, bú huì chídào.~Được, tôi đi tàu điện, sẽ không trễ đâu.", "要是临时有事，记得给我发信息。~Yàoshi línshí yǒu shì, jìde gěi wǒ fā xìnxī.~Nếu có việc đột xuất, nhớ nhắn tin cho tôi.", "没问题，周六见！~Méi wèntí, zhōuliù jiàn!~Không vấn đề, thứ Bảy gặp!"], "Mua quần áo": ["我再看看别的颜色。~Wǒ zài kànkan bié de yánsè.~Tôi xem thêm các màu khác.", "这件有黑色和白色。~Zhè jiàn yǒu hēisè hé báisè.~Cái này có màu đen và màu trắng.", "我喜欢白色的，有我的尺码吗？~Wǒ xǐhuan báisè de, yǒu wǒ de chǐmǎ ma?~Tôi thích màu trắng, có cỡ của tôi không?", "有，我去库房拿。~Yǒu, wǒ qù kùfáng ná.~Có, tôi vào kho lấy.", "好的，就买这件。可以包起来吗？~Hǎo de, jiù mǎi zhè jiàn. Kěyǐ bāo qǐlái ma?~Được, tôi mua cái này. Gói lại giúp tôi được không?", "当然可以，欢迎下次光临。~Dāngrán kěyǐ, huānyíng xià cì guānglín.~Tất nhiên rồi, hoan nghênh quý khách lần sau."], "Gọi điện thoại": ["还有一件事，明天的会议几点开始？~Hái yǒu yí jiàn shì, míngtiān de huìyì jǐ diǎn kāishǐ?~Còn một việc nữa, cuộc họp ngày mai mấy giờ bắt đầu?", "上午九点，在三楼会议室。~Shàngwǔ jiǔ diǎn, zài sān lóu huìyìshì.~Chín giờ sáng, ở phòng họp tầng ba.", "需要带电脑吗？~Xūyào dài diànnǎo ma?~Có cần mang máy tính không?", "要，还要带上上个月的报告。~Yào, hái yào dàishàng shàng ge yuè de bàogào.~Cần, còn phải mang báo cáo tháng trước nữa.", "我记下来了。再见。~Wǒ jì xiàlái le. Zàijiàn.~Tôi ghi lại rồi. Tạm biệt.", "再见，我会转告他的。~Zàijiàn, wǒ huì zhuǎngào tā de.~Tạm biệt, tôi sẽ nhắn lại cho anh ấy."], "Thời tiết và giờ giấc": ["我们坐公交车还是打车？~Wǒmen zuò gōngjiāochē háishi dǎchē?~Chúng ta đi xe buýt hay đi taxi?", "打车太贵了，坐地铁吧。~Dǎchē tài guì le, zuò dìtiě ba.~Đi taxi đắt quá, đi tàu điện đi.", "地铁站离这儿远吗？~Dìtiězhàn lí zhèr yuǎn ma?~Ga tàu điện cách đây có xa không?", "不远，走路五分钟。~Bù yuǎn, zǒulù wǔ fēnzhōng.~Không xa, đi bộ năm phút.", "那我们快走吧！~Nà wǒmen kuài zǒu ba!~Vậy chúng ta đi nhanh thôi!", "等一下，我的手机还在家里！~Děng yíxià, wǒ de shǒujī hái zài jiā lǐ!~Đợi chút, điện thoại của tôi vẫn còn ở nhà!"]}, "ko": {"Chào hỏi": ["어느 나라 사람이에요?~Bạn là người nước nào?", "한국 사람이에요. 서울에 살아요. 지민 씨는요?~Tôi là người Hàn Quốc. Tôi sống ở Seoul. Còn Jimin?", "저는 베트남 사람이에요.~Tôi là người Việt Nam.", "한국어를 공부한 지 얼마나 됐어요?~Bạn học tiếng Hàn được bao lâu rồi?", "육 개월쯤 됐어요. 아직 어려워요.~Khoảng sáu tháng rồi. Vẫn còn khó.", "아니에요, 아주 잘해요!~Đâu có, bạn giỏi lắm!"], "Mua đồ": ["두 개 사면 더 깎아 주실 수 있어요?~Nếu mua hai cái thì giảm thêm được không?", "두 개에 삼만 오천 원에 드릴게요.~Hai cái tôi bán ba mươi lăm nghìn won.", "좋아요. 그렇게 할게요.~Được ạ. Vậy tôi lấy.", "봉투 필요하세요?~Bạn có cần túi không?", "네, 하나 주세요. 카드 돼요?~Vâng, cho tôi một cái. Trả bằng thẻ được không?", "그럼요. 감사합니다. 또 오세요!~Được chứ. Cảm ơn. Lần sau lại ghé nhé!"], "Nhà hàng": ["반찬은 무료예요?~Món ăn kèm có miễn phí không?", "네, 무료예요. 더 필요하시면 말씀하세요.~Vâng, miễn phí. Cần thêm thì cứ nói ạ.", "김치찌개가 정말 맛있어요!~Canh kim chi ngon thật!", "감사합니다. 천천히 드세요.~Cảm ơn quý khách. Cứ thong thả dùng bữa.", "계산서 주세요. 카드로 낼게요.~Cho tôi hóa đơn. Tôi trả bằng thẻ.", "카운터에서 계산해 주세요.~Xin hãy thanh toán ở quầy."], "Quán cà phê": ["영수증 필요하세요?~Quý khách có cần hóa đơn không?", "네, 주세요. 빨대는 어디에 있어요?~Có, cho tôi nhé. Ống hút ở đâu vậy?", "저쪽 선반에 있어요.~Ở trên kệ phía kia ạ.", "와이파이 비밀번호도 알려 주실 수 있어요?~Bạn cho tôi biết cả mật khẩu wifi được không?", "네, 영수증에 적혀 있어요.~Vâng, có ghi trên hóa đơn ạ.", "아, 감사합니다!~À, cảm ơn bạn!"], "Đi khám bệnh": ["약을 먹으면 졸릴 수 있나요?~Uống thuốc có bị buồn ngủ không?", "조금 졸릴 수 있으니까 운전은 피하세요.~Có thể hơi buồn ngủ nên hãy tránh lái xe.", "술은 마셔도 돼요?~Tôi có được uống rượu không?", "아니요, 다 나을 때까지 드시지 마세요.~Không, đừng uống cho đến khi khỏi hẳn.", "삼 일 후에도 열이 나면 어떻게 해요?~Nếu sau ba ngày vẫn sốt thì sao?", "그때는 다시 오세요. 푹 쉬세요.~Lúc đó hãy quay lại. Hãy nghỉ ngơi thật nhiều."], "Đi taxi": ["카드로 결제해도 돼요?~Tôi thanh toán bằng thẻ được không?", "네, 여기 단말기에 대 주세요.~Vâng, hãy đặt thẻ vào máy này.", "영수증 주세요.~Cho tôi hóa đơn.", "여기 있습니다. 짐 잊지 마세요.~Của bạn đây. Đừng quên hành lý nhé.", "감사합니다. 안녕히 가세요.~Cảm ơn. Chào bác.", "네, 좋은 하루 보내세요!~Vâng, chúc bạn một ngày tốt lành!"], "Nói về gia đình": ["형은 몇 살이에요?~Anh trai bạn bao nhiêu tuổi?", "스물여덟 살이고 결혼했어요.~Hai mươi tám tuổi và đã kết hôn.", "여동생은 학생이에요?~Em gái bạn là học sinh à?", "네, 올해 고등학생이 됐어요.~Vâng, năm nay em ấy lên cấp ba.", "집에 반려동물도 있어요?~Nhà bạn có thú cưng không?", "네, 귀여운 강아지가 한 마리 있어요.~Vâng, có một chú chó con đáng yêu."], "Hẹn bạn đi chơi": ["영화 보기 전에 밥부터 먹을까요?~Trước khi xem phim, mình ăn cơm trước nhé?", "좋아요. 저도 배가 고파요.~Hay đấy. Tôi cũng đói rồi.", "그럼 두 시 반에 지하철역에서 만나요.~Vậy hai giờ rưỡi gặp ở ga tàu điện ngầm nhé.", "네, 지하철 타고 갈게요. 늦지 않을 거예요.~Vâng, tôi sẽ đi tàu điện. Sẽ không trễ đâu.", "갑자기 일이 생기면 문자 주세요.~Nếu có việc đột xuất thì nhắn tin cho tôi.", "알겠어요. 토요일에 봐요!~Được rồi. Thứ Bảy gặp nhé!"], "Mua quần áo": ["다른 색깔도 볼 수 있어요?~Tôi xem được màu khác không?", "검은색이랑 흰색이 있어요.~Có màu đen và màu trắng.", "흰색으로 큰 사이즈 있어요?~Có cỡ lớn màu trắng không?", "네, 창고에서 가져다 드릴게요.~Vâng, tôi sẽ vào kho lấy cho bạn.", "딱 맞네요. 이걸로 살게요.~Vừa khít luôn. Tôi mua cái này.", "감사합니다. 카드로 결제하시겠어요?~Cảm ơn quý khách. Quý khách thanh toán bằng thẻ chứ?"], "Gọi điện thoại": ["그리고 내일 회의가 몇 시예요?~Và cuộc họp ngày mai mấy giờ?", "오전 아홉 시, 삼 층 회의실이에요.~Chín giờ sáng, ở phòng họp tầng ba.", "노트북을 가져가야 해요?~Tôi có cần mang laptop không?", "네, 지난달 보고서도 가져오세요.~Có, hãy mang cả báo cáo tháng trước.", "메모했어요. 감사합니다.~Tôi ghi lại rồi. Cảm ơn bạn.", "네, 선생님께 전해 드릴게요. 끊을게요.~Vâng, tôi sẽ nhắn lại cho thầy. Tôi cúp máy nhé."], "Thời tiết và giờ giấc": ["우리 버스 탈까요, 택시 탈까요?~Mình đi xe buýt hay taxi?", "택시는 비싸요. 지하철 타요.~Taxi đắt. Đi tàu điện đi.", "지하철역이 여기서 멀어요?~Ga tàu điện cách đây xa không?", "아니요, 걸어서 오 분이에요.~Không, đi bộ năm phút.", "그럼 빨리 가요!~Vậy mình đi nhanh thôi!", "잠깐만요, 핸드폰을 집에 두고 왔어요!~Đợi chút, tôi để quên điện thoại ở nhà!"], "Đi tàu điện ngầm": ["이 카드에 돈을 충전하고 싶어요.~Tôi muốn nạp tiền vào thẻ này.", "충전기는 저쪽 개찰구 옆에 있어요.~Máy nạp tiền ở cạnh cửa soát vé phía kia.", "얼마나 충전해야 해요?~Tôi nên nạp bao nhiêu?", "보통 만 원 정도면 충분해요.~Thường khoảng mười nghìn won là đủ.", "강남역까지 몇 정거장이에요?~Đến ga Gangnam là mấy trạm?", "여섯 정거장이에요. 이십 분쯤 걸려요.~Sáu trạm. Mất khoảng hai mươi phút."]}, "en": {"Chào hỏi": ["Where are you from?~Bạn đến từ đâu?", "I am from Canada. How about you?~Tôi đến từ Canada. Còn bạn?", "I am from Vietnam. What do you do?~Tôi đến từ Việt Nam. Bạn làm nghề gì?", "I am a teacher. And you?~Tôi là giáo viên. Còn bạn?", "I work in an office.~Tôi làm việc ở văn phòng.", "That sounds interesting. Let us keep in touch!~Nghe thú vị đấy. Hãy giữ liên lạc nhé!"], "Nhà hàng": ["Just some water, please.~Chỉ cần thêm nước thôi.", "Certainly. Here is your order.~Vâng. Đồ ăn của bạn đây.", "Thank you. This sandwich is delicious.~Cảm ơn. Bánh sandwich này ngon quá.", "I am glad you like it. Would you like dessert?~Rất vui vì bạn thích. Bạn có muốn tráng miệng không?", "No, thanks. Could I have the bill, please?~Không, cảm ơn. Cho tôi hóa đơn nhé.", "Of course. I will bring it right away.~Tất nhiên. Tôi mang đến ngay."], "Hỏi đường": ["Do I need to cross the street?~Tôi có phải băng qua đường không?", "Yes, cross at the traffic light.~Có, hãy qua đường ở chỗ đèn giao thông.", "What is next to the station?~Bên cạnh nhà ga có gì?", "There is a pharmacy and a bank.~Có một hiệu thuốc và một ngân hàng.", "Great, thank you so much!~Tuyệt, cảm ơn bạn rất nhiều!", "You are welcome. Have a nice day!~Không có gì. Chúc bạn một ngày tốt lành!"], "Quán cà phê": ["Sure. Please tap your card here.~Được. Vui lòng chạm thẻ vào đây.", "Do you need a receipt?~Bạn có cần hóa đơn không?", "Yes, please. Where can I find the sugar?~Có, làm ơn. Đường ở đâu vậy?", "It is on the counter by the window.~Ở trên quầy cạnh cửa sổ.", "Thank you. Is the Wi-Fi free here?~Cảm ơn. Ở đây có Wi-Fi miễn phí không?", "Yes, the password is on your receipt.~Có, mật khẩu ở trên hóa đơn."], "Đi khám bệnh": ["Do you have any allergies?~Bạn có bị dị ứng gì không?", "Yes, I am allergic to penicillin.~Có, tôi dị ứng với penicillin.", "Thank you for telling me. This medicine does not contain it.~Cảm ơn bạn đã báo. Thuốc này không chứa penicillin.", "Should I take time off work?~Tôi có nên xin nghỉ làm không?", "Yes, rest for two days and drink plenty of water. If you are not better in three days, come back.~Có, hãy nghỉ hai ngày và uống nhiều nước. Nếu sau ba ngày chưa đỡ, hãy quay lại.", "I will. Thank you again, doctor.~Tôi sẽ quay lại. Cảm ơn bác sĩ một lần nữa."], "Đi taxi": ["Can I pay by card?~Tôi trả bằng thẻ được không?", "Of course. Just tap it here.~Tất nhiên. Chỉ cần chạm thẻ vào đây.", "Could I have a receipt, please?~Làm ơn cho tôi hóa đơn.", "Here you go. Do not forget your bags.~Của bạn đây. Đừng quên hành lý nhé.", "Thanks for the ride!~Cảm ơn vì chuyến đi!", "You are welcome. Have a safe flight!~Không có gì. Chúc bạn bay an toàn!"], "Nói về gia đình": ["How old is your brother?~Anh trai bạn bao nhiêu tuổi?", "He is twenty-eight and he is married.~Anh ấy hai mươi tám tuổi và đã kết hôn.", "And your sister? Is she still in school?~Còn chị bạn thì sao? Chị ấy còn đi học không?", "Yes, she is in her last year of high school.~Có, chị ấy đang học năm cuối cấp ba.", "Do you have any pets?~Bạn có thú cưng không?", "We have a small dog. He is very cute.~Nhà tôi có một chú chó nhỏ. Nó rất dễ thương."], "Hẹn bạn đi chơi": ["Should we eat before the movie?~Mình có nên ăn trước khi xem phim không?", "Good idea. I am a little hungry.~Ý hay đấy. Tôi hơi đói rồi.", "Then let us meet at two thirty at the station.~Vậy mình gặp lúc hai giờ rưỡi ở nhà ga nhé.", "Okay. I will take the subway, so I will not be late.~Được. Tôi sẽ đi tàu điện ngầm nên sẽ không trễ.", "Text me if anything comes up.~Nếu có việc đột xuất thì nhắn tin cho tôi nhé.", "Will do. See you on Saturday!~Được. Thứ Bảy gặp nhé!"], "Mua quần áo": ["Do you have it in other colors?~Cái này có màu khác không?", "We have black and white.~Chúng tôi có màu đen và màu trắng.", "I like the white one. Do you have my size?~Tôi thích màu trắng. Có cỡ của tôi không?", "Yes, let me get it from the back.~Có, để tôi vào kho lấy.", "It is perfect. I will take it.~Hoàn hảo. Tôi lấy cái này.", "Great. Would you like to pay by cash or card?~Tuyệt. Bạn muốn trả bằng tiền mặt hay thẻ?"], "Gọi điện thoại": ["One more thing. What time is tomorrow's meeting?~Còn một việc nữa. Cuộc họp ngày mai mấy giờ?", "It starts at nine in the morning, in Room 3.~Cuộc họp bắt đầu lúc chín giờ sáng, ở Phòng 3.", "Do I need to bring my laptop?~Tôi có cần mang laptop không?", "Yes, and last month's report too.~Có, và cả báo cáo tháng trước nữa.", "Got it. Thank you, goodbye.~Tôi hiểu rồi. Cảm ơn, tạm biệt.", "Goodbye. I will pass on your message.~Tạm biệt. Tôi sẽ chuyển lời nhắn của bạn."], "Thời tiết và giờ giấc": ["Should we take the bus or a taxi?~Mình đi xe buýt hay taxi?", "A taxi is too expensive. Let us take the subway.~Taxi đắt quá. Mình đi tàu điện ngầm đi.", "Is the station far from here?~Ga tàu có xa đây không?", "No, it is a five-minute walk.~Không, đi bộ năm phút.", "Then let us go quickly!~Vậy mình đi nhanh thôi!", "Wait, I left my phone at home!~Khoan, tôi để quên điện thoại ở nhà!"], "Nhận phòng khách sạn": ["Is there a swimming pool in the hotel?~Khách sạn có hồ bơi không?", "Yes, it is on the fifth floor and open until ten at night.~Có, ở tầng năm và mở cửa đến mười giờ tối.", "Could I have a late check-out tomorrow?~Ngày mai tôi trả phòng muộn được không?", "I can give you until two o'clock for an extra fee.~Tôi có thể cho bạn đến hai giờ chiều với một khoản phí thêm.", "That is fine. Where is the elevator?~Được ạ. Thang máy ở đâu?", "Straight ahead, on your right. Here is your key card.~Đi thẳng, bên phải bạn. Đây là thẻ phòng của bạn."], "Ở chỗ làm": ["Thank you. I will send you the file now.~Cảm ơn bạn. Tôi sẽ gửi tập tin cho bạn ngay.", "Please check the numbers on page three.~Bạn hãy kiểm tra các số liệu ở trang ba.", "Do you think we need more data?~Bạn có nghĩ chúng ta cần thêm dữ liệu không?", "Maybe. Let us ask the manager for her opinion.~Có thể. Mình hỏi ý kiến quản lý nhé.", "Good idea. Is she free this afternoon?~Ý hay đấy. Chiều nay chị ấy rảnh không?", "She has a meeting until two. We can talk after that.~Chị ấy họp đến hai giờ. Sau đó mình nói chuyện được."]}});

CQV.push(...[["課本", "kèběn", "textbook", "sách giáo khoa", "請把課本翻到第十頁。", "Qǐng bǎ kèběn fān dào dì shí yè.", "Please turn your textbook to page ten.", "Học tập"], ["單字", "dānzì", "vocabulary word", "từ vựng", "我每天背十個新單字。", "Wǒ měitiān bèi shí ge xīn dānzì.", "I memorize ten new words every day.", "Học tập"], ["發音", "fāyīn", "pronunciation", "phát âm", "你的發音越來越標準了。", "Nǐ de fāyīn yuè lái yuè biāozhǔn le.", "Your pronunciation is getting more and more standard.", "Học tập"], ["句子", "jùzi", "sentence", "câu", "請用這個詞造一個句子。", "Qǐng yòng zhège cí zào yí ge jùzi.", "Please make a sentence with this word.", "Học tập"], ["意思", "yìsi", "meaning", "ý nghĩa", "這個字是什麼意思？", "Zhège zì shì shénme yìsi?", "What does this character mean?", "Học tập"], ["上課", "shàngkè", "to attend class", "lên lớp, đi học", "我們星期三晚上上課。", "Wǒmen xīngqīsān wǎnshang shàngkè.", "We have class on Wednesday evenings.", "Học tập"], ["遲到", "chídào", "to be late", "đến muộn", "對不起，我今天遲到了。", "Duìbuqǐ, wǒ jīntiān chídào le.", "Sorry, I'm late today.", "Học tập"], ["報名", "bàomíng", "to sign up", "đăng ký", "我想報名下個月的中文班。", "Wǒ xiǎng bàomíng xià ge yuè de Zhōngwén bān.", "I'd like to sign up for next month's Chinese class.", "Học tập"], ["進步", "jìnbù", "to improve", "tiến bộ", "你的中文進步很多。", "Nǐ de Zhōngwén jìnbù hěn duō.", "Your Chinese has improved a lot.", "Học tập"], ["認真", "rènzhēn", "diligent, serious", "chăm chỉ, nghiêm túc", "她學習很認真。", "Tā xuéxí hěn rènzhēn.", "She studies very diligently.", "Học tập"], ["下班", "xiàbān", "to finish work", "tan làm", "下班以後我想早點回家。", "Xiàbān yǐhòu wǒ xiǎng zǎodiǎn huíjiā.", "After work I want to get home early.", "Đi làm"], ["工作", "gōngzuò", "work, job", "công việc", "這份工作我做了兩年。", "Zhè fèn gōngzuò wǒ zuò le liǎng nián.", "I've done this job for two years.", "Đi làm"], ["面試", "miànshì", "job interview", "phỏng vấn", "明天早上我有一個面試。", "Míngtiān zǎoshang wǒ yǒu yí ge miànshì.", "I have an interview tomorrow morning.", "Đi làm"], ["履歷", "lǚlì", "resume", "sơ yếu lý lịch", "請把履歷寄到這個信箱。", "Qǐng bǎ lǚlì jì dào zhège xìnxiāng.", "Please send your resume to this email address.", "Đi làm"], ["打卡", "dǎkǎ", "to clock in", "chấm công", "我每天早上到公司就打卡。", "Wǒ měitiān zǎoshang dào gōngsī jiù dǎkǎ.", "I clock in as soon as I get to the company every morning.", "Đi làm"], ["合約", "héyuē", "contract", "hợp đồng", "簽合約以前要看清楚。", "Qiān héyuē yǐqián yào kàn qīngchǔ.", "Read carefully before signing a contract.", "Đi làm"], ["完成", "wánchéng", "to complete", "hoàn thành", "這份工作下週五前要完成。", "Zhè fèn gōngzuò xià zhōu wǔ qián yào wánchéng.", "This work must be completed by next Friday.", "Đi làm"], ["通知", "tōngzhī", "to notify", "thông báo", "有消息我會馬上通知你。", "Yǒu xiāoxi wǒ huì mǎshàng tōngzhī nǐ.", "If there's news I'll notify you right away.", "Đi làm"], ["幫忙", "bāngmáng", "to help", "giúp đỡ", "可以請你幫忙嗎？", "Kěyǐ qǐng nǐ bāngmáng ma?", "Could you help me?", "Đi làm"], ["辛苦", "xīnkǔ", "hard work, tiring", "vất vả", "大家今天辛苦了！", "Dàjiā jīntiān xīnkǔ le!", "Thank you all for your hard work today!", "Đi làm"], ["結帳", "jiézhàng", "to pay the bill", "thanh toán", "請問在哪裡結帳？", "Qǐngwèn zài nǎlǐ jiézhàng?", "Excuse me, where can I pay?", "Mua đồ"], ["找錢", "zhǎoqián", "to give change", "thối tiền", "老闆，您還沒找我錢。", "Lǎobǎn, nín hái méi zhǎo wǒ qián.", "Boss, you haven't given me my change yet.", "Mua đồ"], ["零錢", "língqián", "small change", "tiền lẻ", "我沒有零錢，只有一百元。", "Wǒ méiyǒu língqián, zhǐyǒu yì bǎi yuán.", "I don't have change, only a hundred-dollar bill.", "Mua đồ"], ["特價", "tèjià", "special price", "giá khuyến mãi", "這個星期蘋果特價。", "Zhège xīngqī píngguǒ tèjià.", "Apples are on special this week.", "Mua đồ"], ["新鮮", "xīnxiān", "fresh", "tươi", "這些魚今天早上才送來，很新鮮。", "Zhèxiē yú jīntiān zǎoshang cái sònglái, hěn xīnxiān.", "These fish arrived just this morning; they are very fresh.", "Mua đồ"], ["外送", "wàisòng", "delivery", "giao hàng", "我晚餐想叫外送。", "Wǒ wǎncān xiǎng jiào wàisòng.", "I'd like to order delivery for dinner.", "Mua đồ"], ["打包", "dǎbāo", "to pack to go", "gói mang về", "這個菜可以幫我打包嗎？", "Zhège cài kěyǐ bāng wǒ dǎbāo ma?", "Can you pack this dish to go for me?", "Mua đồ"], ["逛街", "guàngjiē", "to go shopping, stroll the streets", "đi dạo phố mua sắm", "週末我常常和朋友逛街。", "Zhōumò wǒ chángcháng hé péngyou guàngjiē.", "On weekends I often go shopping with friends.", "Mua đồ"], ["顏色", "yánsè", "color", "màu sắc", "這件有別的顏色嗎？", "Zhè jiàn yǒu bié de yánsè ma?", "Does this come in other colors?", "Mua đồ"], ["保固", "bǎogù", "warranty", "bảo hành", "這台電鍋有一年保固。", "Zhè tái diànguō yǒu yì nián bǎogù.", "This rice cooker has a one-year warranty.", "Mua đồ"]]);
CQP.push(...[["10. Bữa ăn trưa (吃飯)", [["中午我常常和同事一起吃便當。", "Zhōngwǔ wǒ chángcháng hé tóngshì yìqǐ chī biàndāng.", "At noon I often eat lunch boxes with my coworkers."], ["台灣的便當有飯、肉和青菜，很健康。", "Táiwān de biàndāng yǒu fàn, ròu hé qīngcài, hěn jiànkāng.", "Taiwanese lunch boxes have rice, meat and vegetables, and they are healthy."], ["吃完飯，我們會去散步十分鐘。", "Chī wán fàn, wǒmen huì qù sànbù shí fēnzhōng.", "After eating, we go for a ten-minute walk."]]], ["11. Chợ truyền thống (傳統市場)", [["星期六早上，我跟鄰居阿姨去傳統市場買菜。", "Xīngqīliù zǎoshang, wǒ gēn línjū āyí qù chuántǒng shìchǎng mǎi cài.", "On Saturday morning, I go to the traditional market with my neighbor auntie to buy vegetables."], ["攤販很熱情，常常說「來，嚐嚐看」。", "Tānfàn hěn rèqíng, chángcháng shuō “lái, chángchang kàn”.", "The vendors are enthusiastic and often say “come, give it a try.”"], ["我買了青菜、雞蛋和兩顆芒果，一共兩百元。", "Wǒ mǎi le qīngcài, jīdàn hé liǎng kē mángguǒ, yígòng liǎng bǎi yuán.", "I bought vegetables, eggs and two mangoes, two hundred dollars in total."]]], ["12. Đi khám bệnh (看醫生)", [["昨天我有點發燒，還一直咳嗽。", "Zuótiān wǒ yǒudiǎn fāshāo, hái yìzhí késòu.", "Yesterday I had a slight fever and kept coughing."], ["我帶健保卡去診所，醫生說我感冒了。", "Wǒ dài jiànbǎokǎ qù zhěnsuǒ, yīshēng shuō wǒ gǎnmào le.", "I took my national health insurance card to the clinic, and the doctor said I had a cold."], ["醫生要我多喝水、多休息，按時吃藥。", "Yīshēng yào wǒ duō hē shuǐ, duō xiūxí, ànshí chī yào.", "The doctor told me to drink lots of water, rest more, and take my medicine on time."]]], ["13. Cuối tuần ở nhà (週末在家)", [["週末我不用上班，可以睡到自然醒。", "Zhōumò wǒ búyòng shàngbān, kěyǐ shuì dào zìrán xǐng.", "On weekends I don't have to work, so I can sleep until I wake up naturally."], ["起床以後，我洗衣服、打掃房間。", "Qǐchuáng yǐhòu, wǒ xǐ yīfu, dǎsǎo fángjiān.", "After getting up, I do laundry and clean my room."], ["下午我會泡一杯茶，看一部喜歡的電影。", "Xiàwǔ wǒ huì pào yì bēi chá, kàn yí bù xǐhuān de diànyǐng.", "In the afternoon I brew a cup of tea and watch a movie I like."]]], ["14. Bạn bè gặp nhau (朋友聚會)", [["這個週末，我和三個朋友約好一起吃火鍋。", "Zhège zhōumò, wǒ hé sān ge péngyou yuēhǎo yìqǐ chī huǒguō.", "This weekend, three friends and I have arranged to eat hot pot together."], ["我們在群組裡討論要幾點見面。", "Wǒmen zài qúnzǔ lǐ tǎolùn yào jǐ diǎn jiànmiàn.", "We discuss in the group chat what time to meet."], ["大家聊天聊得很開心，不知不覺就十點了。", "Dàjiā liáotiān liáo de hěn kāixīn, bù zhī bù jué jiù shí diǎn le.", "Everyone chatted happily, and before we knew it, it was ten o'clock."]]], ["15. Ngày mưa (下雨天)", [["今天早上突然下大雨，我忘了帶傘。", "Jīntiān zǎoshang tūrán xià dàyǔ, wǒ wàng le dài sǎn.", "This morning it suddenly rained heavily and I forgot to bring an umbrella."], ["我只好在便利商店買了一把新的雨傘。", "Wǒ zhǐhǎo zài biànlì shāngdiàn mǎi le yì bǎ xīn de yǔsǎn.", "I had no choice but to buy a new umbrella at the convenience store."], ["雨天路滑，騎機車的人都慢慢地騎。", "Yǔtiān lù huá, qí jīchē de rén dōu mànmàn de qí.", "The roads are slippery on rainy days, so scooter riders all ride slowly."]]], ["16. Đi lại (交通)", [["如果沒有搭捷運，我就坐公車去上班。", "Rúguǒ méiyǒu dā jiéyùn, wǒ jiù zuò gōngchē qù shàngbān.", "If I'm not taking the MRT, I take the bus to work."], ["上車的時候，我用悠遊卡刷一下就可以了。", "Shàngchē de shíhou, wǒ yòng Yōuyóukǎ shuā yíxià jiù kěyǐ le.", "When boarding, I just tap my EasyCard."], ["天氣好的時候，我也喜歡騎公共腳踏車。", "Tiānqì hǎo de shíhou, wǒ yě xǐhuān qí gōnggòng jiǎotàchē.", "When the weather is nice, I also like riding public bikes."]]], ["17. Ở bưu điện (郵局)", [["我想寄一個包裹給我在越南的家人。", "Wǒ xiǎng jì yí ge bāoguǒ gěi wǒ zài Yuènán de jiārén.", "I want to mail a parcel to my family in Vietnam."], ["郵局的小姐請我先填寫寄件單。", "Yóujú de xiǎojiě qǐng wǒ xiān tiánxiě jìjiàndān.", "The woman at the post office asked me to fill out the shipping form first."], ["她說大概一個星期可以寄到。", "Tā shuō dàgài yí ge xīngqī kěyǐ jì dào.", "She said it should arrive in about a week."]]], ["18. Nấu cơm (煮飯)", [["週末我喜歡自己煮飯，比外面吃便宜又健康。", "Zhōumò wǒ xǐhuān zìjǐ zhǔ fàn, bǐ wàimiàn chī piányi yòu jiànkāng.", "On weekends I like cooking for myself, which is cheaper and healthier than eating out."], ["我用電鍋煮飯，也可以蒸魚和蒸蛋。", "Wǒ yòng diànguō zhǔ fàn, yě kěyǐ zhēng yú hé zhēng dàn.", "I cook rice in an electric rice cooker, and I can also steam fish and eggs."], ["今天的菜是番茄炒蛋，家人一定會喜歡。", "Jīntiān de cài shì fānqié chǎo dàn, jiārén yídìng huì xǐhuān.", "Today's dish is tomato scrambled eggs; my family will surely like it."]]], ["19. Tết Âm lịch (過年)", [["農曆新年是台灣最重要的節日之一。", "Nónglì xīnnián shì Táiwān zuì zhòngyào de jiérì zhī yī.", "Lunar New Year is one of Taiwan's most important holidays."], ["大家會回老家，一起吃年夜飯。", "Dàjiā huì huí lǎojiā, yìqǐ chī niányèfàn.", "Everyone goes back to their hometown to eat the New Year's Eve dinner together."], ["長輩會給小孩子紅包，說「新年快樂」。", "Zhǎngbèi huì gěi xiǎoháizi hóngbāo, shuō “xīnnián kuàilè”.", "Elders give children red envelopes and say “Happy New Year.”"]]], ["20. Nhắn tin (聊天)", [["在台灣，大家都用LINE聊天和傳訊息。", "Zài Táiwān, dàjiā dōu yòng LINE liáotiān hé chuán xùnxī.", "In Taiwan, everyone uses LINE to chat and send messages."], ["我常常傳貼圖給朋友，很有意思。", "Wǒ chángcháng chuán tiētú gěi péngyou, hěn yǒu yìsi.", "I often send stickers to friends, which is fun."], ["如果有急事，我會直接打電話。", "Rúguǒ yǒu jíshì, wǒ huì zhíjiē dǎ diànhuà.", "If it's urgent, I just call directly."]]], ["21. Dọn dẹp nhà cửa (打掃)", [["每個星期天，我都會把房間整理乾淨。", "Měi ge xīngqītiān, wǒ dōu huì bǎ fángjiān zhěnglǐ gānjìng.", "Every Sunday I tidy my room until it's clean."], ["我先掃地，再拖地，最後把垃圾拿去丟。", "Wǒ xiān sǎodì, zài tuōdì, zuìhòu bǎ lājī ná qù diū.", "I sweep first, then mop, and finally take the trash out."], ["台灣的垃圾車會播音樂，大家聽到就拿垃圾出去。", "Táiwān de lājīchē huì bō yīnyuè, dàjiā tīngdào jiù ná lājī chūqù.", "Taiwan's garbage trucks play music, and when people hear it they bring their trash out."]]], ["22. Tập thể dục buổi sáng (運動)", [["我早上五點半起床，去附近的公園運動。", "Wǒ zǎoshang wǔ diǎn bàn qǐchuáng, qù fùjìn de gōngyuán yùndòng.", "I get up at 5:30 in the morning and exercise at a nearby park."], ["很多老人家在公園打太極拳、跳舞。", "Hěn duō lǎorénjiā zài gōngyuán dǎ tàijíquán, tiàowǔ.", "Many elderly people do tai chi and dance in the park."], ["運動完，我會在路邊買一杯無糖豆漿。", "Yùndòng wán, wǒ huì zài lùbiān mǎi yì bēi wútáng dòujiāng.", "After exercising, I buy a cup of unsweetened soy milk by the roadside."]]], ["23. Đi ngủ sớm (睡覺)", [["晚上十一點以前，我一定會上床睡覺。", "Wǎnshang shíyī diǎn yǐqián, wǒ yídìng huì shàngchuáng shuìjiào.", "Before eleven at night, I always go to bed."], ["睡前我不看手機，而是看一點書。", "Shuì qián wǒ bú kàn shǒujī, érshì kàn yìdiǎn shū.", "Before bed I don't look at my phone; I read a little instead."], ["睡得好，第二天才有精神工作和學習。", "Shuì de hǎo, dì èr tiān cái yǒu jīngshén gōngzuò hé xuéxí.", "When you sleep well, you have the energy to work and study the next day."]]]]);
CQP.splice(6,0,...([["7. Ở công ty (在公司)", [["到了公司，我先打卡，然後打開電腦。", "Dào le gōngsī, wǒ xiān dǎkǎ, ránhòu dǎkāi diànnǎo.", "After arriving at the company, I first clock in and then turn on my computer."], ["我的工作是整理資料和回覆訊息。", "Wǒ de gōngzuò shì zhěnglǐ zīliào hé huífù xùnxí.", "My job is organizing data and replying to messages."], ["有問題的時候，我會問旁邊的同事。", "Yǒu wèntí de shíhòu, wǒ huì wèn pángbiān de tóngshì.", "When I have a question, I ask the coworker next to me."]]], ["8. Họp với đồng nghiệp (開會)", [["今天上午十點，我們要開會。", "Jīntiān shàngwǔ shí diǎn, wǒmen yào kāihuì.", "This morning at ten o'clock, we have a meeting."], ["主管說明這個月的工作重點。", "Zhǔguǎn shuōmíng zhège yuè de gōngzuò zhòngdiǎn.", "The supervisor explained this month's work priorities."], ["我聽不懂的地方，會在會後請同事再說一次。", "Wǒ tīng bù dǒng de dìfāng, huì zài huì hòu qǐng tóngshì zài shuō yí cì.", "For the parts I don't understand, I ask a coworker to explain again after the meeting."]]], ["9. Giờ nghỉ giải lao (休息時間)", [["下午三點是休息時間，大家會去倒茶或咖啡。", "Xiàwǔ sān diǎn shì xiūxi shíjiān, dàjiā huì qù dào chá huò kāfēi.", "Three in the afternoon is break time, and everyone goes to pour tea or coffee."], ["我喜歡站在窗邊，看外面的天空。", "Wǒ xǐhuan zhàn zài chuāng biān, kàn wàimiàn de tiānkōng.", "I like to stand by the window and look at the sky outside."], ["休息十分鐘後，我又有精神工作了。", "Xiūxi shí fēnzhōng hòu, wǒ yòu yǒu jīngshén gōngzuò le.", "After a ten-minute rest, I have energy to work again."]]]]));
CQP.push(...([["24. Đi siêu thị (逛超市)", [["週末下午，我去超市買菜。", "Zhōumò xiàwǔ, wǒ qù chāoshì mǎi cài.", "On weekend afternoons, I go to the supermarket to buy groceries."], ["今天雞蛋和青菜都在特價。", "Jīntiān jīdàn hé qīngcài dōu zài tèjià.", "Today eggs and vegetables are both on sale."], ["結帳的時候，店員問我要不要塑膠袋。", "Jiézhàng de shíhòu, diànyuán wèn wǒ yào bú yào sùjiāo dài.", "At checkout, the clerk asked if I wanted a plastic bag."]]], ["25. Gửi tiền về nhà (匯錢回家)", [["每個月我都會匯錢回越南給家人。", "Měi ge yuè wǒ dōu huì huì qián huí Yuènán gěi jiārén.", "Every month I send money back to Vietnam for my family."], ["匯款以前，我會先看今天的匯率。", "Huìkuǎn yǐqián, wǒ huì xiān kàn jīntiān de huìlǜ.", "Before sending money, I first check today's exchange rate."], ["媽媽收到錢以後，會打電話跟我說謝謝。", "Māma shōudào qián yǐhòu, huì dǎ diànhuà gēn wǒ shuō xièxie.", "After Mom receives the money, she calls me to say thanks."]]], ["26. Học tiếng Trung (學中文)", [["每個星期三晚上，我去上中文課。", "Měi ge xīngqī sān wǎnshang, wǒ qù shàng Zhōngwén kè.", "Every Wednesday evening, I go to Chinese class."], ["老師教我們用注音和拼音念字。", "Lǎoshī jiāo wǒmen yòng zhùyīn hé pīnyīn niàn zì.", "The teacher teaches us to read characters with zhuyin and pinyin."], ["回家以後，我每天複習十個新單字。", "Huí jiā yǐhòu, wǒ měitiān fùxí shí ge xīn dānzì.", "After getting home, I review ten new words every day."]]], ["27. Thẻ cư trú (居留證)", [["我的居留證快到期了。", "Wǒ de jūliúzhèng kuài dàoqí le.", "My residence card is about to expire."], ["我要帶護照和照片去辦手續。", "Wǒ yào dài hùzhào hé zhàopiàn qù bàn shǒuxù.", "I need to bring my passport and photos to handle the procedure."], ["辦好以後，我就可以安心工作了。", "Bàn hǎo yǐhòu, wǒ jiù kěyǐ ānxīn gōngzuò le.", "Once it is done, I can work with peace of mind."]]], ["28. Đi ngân hàng (去銀行)", [["我想去銀行開一個帳戶。", "Wǒ xiǎng qù yínháng kāi yí ge zhànghù.", "I want to go to the bank to open an account."], ["櫃檯的小姐請我填這張表。", "Guìtái de xiǎojiě qǐng wǒ tián zhè zhāng biǎo.", "The woman at the counter asked me to fill out this form."], ["我也申請了一張提款卡。", "Wǒ yě shēnqǐng le yì zhāng tíkuǎnkǎ.", "I also applied for an ATM card."]]], ["29. Mua quần áo (買衣服)", [["天氣變冷了，我想買一件外套。", "Tiānqì biàn lěng le, wǒ xiǎng mǎi yí jiàn wàitào.", "The weather has turned cold, so I want to buy a jacket."], ["我試穿了M號，可是有一點大。", "Wǒ shìchuān le M hào, kěshì yǒu yìdiǎn dà.", "I tried on size M, but it was a little big."], ["老闆說可以換小一點的，我就買了。", "Lǎobǎn shuō kěyǐ huàn xiǎo yìdiǎn de, wǒ jiù mǎi le.", "The boss said I could swap for a smaller one, so I bought it."]]], ["30. Quán trà sữa (手搖飲料店)", [["下班以後，我跟朋友去買手搖飲料。", "Xiàbān yǐhòu, wǒ gēn péngyǒu qù mǎi shǒuyáo yǐnliào.", "After work, I go with a friend to buy a hand-shaken drink."], ["我每次都點半糖少冰的珍珠奶茶。", "Wǒ měi cì dōu diǎn bàn táng shǎo bīng de zhēnzhū nǎichá.", "Every time I order bubble milk tea with half sugar and less ice."], ["一杯要六十塊，有一點貴，可是真的很好喝。", "Yì bēi yào liùshí kuài, yǒu yìdiǎn guì, kěshì zhēn de hěn hǎohē.", "One cup costs sixty dollars, a bit pricey, but it's really tasty."]]], ["31. Đi xe buýt (搭公車)", [["我平常搭公車去上課。", "Wǒ píngcháng dā gōngchē qù shàngkè.", "I usually take the bus to class."], ["上車的時候，我用悠遊卡刷卡。", "Shàngchē de shíhòu, wǒ yòng yōuyóukǎ shuākǎ.", "When boarding, I tap my EasyCard."], ["快到站的時候，我會按鈴下車。", "Kuài dào zhàn de shíhòu, wǒ huì àn líng xiàchē.", "When nearing my stop, I press the bell and get off."]]], ["32. Hỏi đường (問路)", [["我找不到郵局，所以問路人。", "Wǒ zhǎo bú dào yóujú, suǒyǐ wèn lùrén.", "I couldn't find the post office, so I asked a passerby."], ["他說一直走，到紅綠燈就右轉。", "Tā shuō yìzhí zǒu, dào hónglǜdēng jiù yòu zhuǎn.", "He said to go straight and turn right at the traffic light."], ["我說了謝謝，心裡覺得很溫暖。", "Wǒ shuō le xièxie, xīn lǐ juéde hěn wēnnuǎn.", "I said thank you and felt warm inside."]]], ["33. Đi công viên (去公園)", [["星期天早上，我去附近的公園走路。", "Xīngqītiān zǎoshang, wǒ qù fùjìn de gōngyuán zǒulù.", "On Sunday morning, I go walking at a nearby park."], ["公園裡有很多老人在打太極拳。", "Gōngyuán lǐ yǒu hěn duō lǎorén zài dǎ tàijíquán.", "There are many elderly people practicing tai chi in the park."], ["我坐在長椅上，喝一杯熱茶，真舒服。", "Wǒ zuò zài chángyǐ shàng, hē yì bēi rè chá, zhēn shūfú.", "I sit on a bench and drink a cup of hot tea. So comfortable."]]], ["34. Sinh nhật (生日)", [["今天是我朋友的生日。", "Jīntiān shì wǒ péngyǒu de shēngrì.", "Today is my friend's birthday."], ["我們買了蛋糕，還一起唱生日快樂歌。", "Wǒmen mǎi le dàngāo, hái yìqǐ chàng shēngrì kuàilè gē.", "We bought a cake and sang the birthday song together."], ["她許了願，笑得很開心。", "Tā xǔ le yuàn, xiào de hěn kāixīn.", "She made a wish and smiled happily."]]], ["35. Nấu món Việt (煮越南菜)", [["週末我想煮越南河粉給朋友吃。", "Zhōumò wǒ xiǎng zhǔ Yuènán héfěn gěi péngyǒu chī.", "On the weekend I want to cook Vietnamese pho for my friends."], ["在台灣也買得到九層塔和檸檬。", "Zài Táiwān yě mǎi de dào jiǔcéngtǎ hé níngméng.", "In Taiwan you can also buy Thai basil and lemons."], ["朋友說這碗河粉有家鄉的味道。", "Péngyǒu shuō zhè wǎn héfěn yǒu jiāxiāng de wèidào.", "My friend said this bowl of pho tastes like home."]]], ["36. Gặp bạn người Việt (越南朋友)", [["星期六，我跟幾個越南朋友見面。", "Xīngqīliù, wǒ gēn jǐ ge Yuènán péngyǒu jiànmiàn.", "On Saturday I meet a few Vietnamese friends."], ["我們一邊吃飯，一邊聊工作和家人。", "Wǒmen yìbiān chīfàn, yìbiān liáo gōngzuò hé jiārén.", "We chat about work and family while eating."], ["有朋友在身邊，我就不覺得孤單。", "Yǒu péngyǒu zài shēnbiān, wǒ jiù bù juéde gūdān.", "With friends nearby, I don't feel lonely."]]], ["37. Mua vé tàu (買火車票)", [["我想買一張去台中的火車票。", "Wǒ xiǎng mǎi yì zhāng qù Táizhōng de huǒchē piào.", "I want to buy a train ticket to Taichung."], ["售票員問我要買自強號還是區間車。", "Shòupiàoyuán wèn wǒ yào mǎi Zìqiáng Hào háishi qūjiān chē.", "The ticket seller asked whether I wanted the Tze-Chiang express or the local train."], ["區間車比較慢，可是比較便宜。", "Qūjiān chē bǐjiào màn, kěshì bǐjiào piányi.", "The local train is slower but cheaper."]]], ["38. Du lịch cuối tuần (週末旅行)", [["這個週末，我跟朋友去花蓮玩。", "Zhège zhōumò, wǒ gēn péngyǒu qù Huālián wán.", "This weekend I go to Hualien with friends."], ["我們租了一輛車，沿著海邊開。", "Wǒmen zū le yí liàng chē, yánzhe hǎibiān kāi.", "We rented a car and drove along the coast."], ["風景太美了，我拍了很多照片。", "Fēngjǐng tài měi le, wǒ pāi le hěn duō zhàopiàn.", "The scenery was so beautiful that I took many photos."]]], ["39. Bị cảm (感冒)", [["昨天下雨，我淋濕了，今天就感冒了。", "Zuótiān xiàyǔ, wǒ línshī le, jīntiān jiù gǎnmào le.", "It rained yesterday and I got soaked, so today I caught a cold."], ["我一直咳嗽，也有一點發燒。", "Wǒ yìzhí késòu, yě yǒu yìdiǎn fāshāo.", "I keep coughing and have a slight fever."], ["我請了一天假，在家多喝水、好好休息。", "Wǒ qǐng le yì tiān jià, zài jiā duō hē shuǐ, hǎohāo xiūxi.", "I took a day off to drink lots of water and rest at home."]]], ["40. Hiệu thuốc (藥局)", [["我去藥局買感冒藥。", "Wǒ qù yàojú mǎi gǎnmào yào.", "I go to the pharmacy to buy cold medicine."], ["藥師問我有沒有對什麼藥過敏。", "Yàoshī wèn wǒ yǒu méiyǒu duì shénme yào guòmǐn.", "The pharmacist asked if I'm allergic to any medicine."], ["她告訴我，這種藥飯後吃，一天三次。", "Tā gàosu wǒ, zhè zhǒng yào fàn hòu chī, yì tiān sān cì.", "She told me to take this medicine after meals, three times a day."]]], ["41. Điện thoại hỏng (手機壞了)", [["我的手機掉到地上，螢幕破了。", "Wǒ de shǒujī diào dào dì shàng, yíngmù pò le.", "My phone fell on the floor and the screen cracked."], ["我拿去手機行問修理要多少錢。", "Wǒ ná qù shǒujī háng wèn xiūlǐ yào duōshǎo qián.", "I took it to a phone shop to ask how much the repair costs."], ["老闆說一個小時就可以修好。", "Lǎobǎn shuō yí ge xiǎoshí jiù kěyǐ xiūhǎo.", "The boss said it can be fixed within an hour."]]], ["42. Trung thu nướng thịt (中秋節烤肉)", [["中秋節的晚上，大家會一起烤肉。", "Zhōngqiū Jié de wǎnshang, dàjiā huì yìqǐ kǎoròu.", "On Mid-Autumn night, everyone barbecues together."], ["我們一邊烤肉，一邊吃月餅和柚子。", "Wǒmen yìbiān kǎoròu, yìbiān chī yuèbǐng hé yòuzi.", "We eat mooncakes and pomelo while barbecuing."], ["天上的月亮又大又圓，真漂亮。", "Tiānshàng de yuèliàng yòu dà yòu yuán, zhēn piàoliàng.", "The moon in the sky is big and round, so beautiful."]]], ["43. Lễ hội đèn lồng (元宵節)", [["元宵節那天，很多地方都有燈會。", "Yuánxiāo Jié nà tiān, hěn duō dìfāng dōu yǒu dēnghuì.", "On Lantern Festival day, many places have lantern shows."], ["我跟朋友去看了各種漂亮的燈籠。", "Wǒ gēn péngyǒu qù kàn le gèzhǒng piàoliàng de dēnglóng.", "A friend and I went to see all kinds of pretty lanterns."], ["我們還吃了湯圓，希望新的一年平安。", "Wǒmen hái chī le tāngyuán, xīwàng xīn de yì nián píng'ān.", "We also ate tangyuan, hoping for a safe new year."]]], ["44. Nhớ nhà (想家)", [["到了晚上，我常常想念越南的家人。", "Dào le wǎnshang, wǒ chángcháng xiǎngniàn Yuènán de jiārén.", "At night, I often miss my family in Vietnam."], ["我看著照片，心裡有一點難過。", "Wǒ kàn zhe zhàopiàn, xīn lǐ yǒu yìdiǎn nánguò.", "Looking at the photos, I feel a bit sad."], ["還好我們可以視訊，馬上就能看到彼此。", "Hái hǎo wǒmen kěyǐ shìxùn, mǎshàng jiù néng kàndào bǐcǐ.", "Luckily we can video call and see each other right away."]]], ["45. Kế hoạch tương lai (未來計畫)", [["明年，我想考中文檢定。", "Míngnián, wǒ xiǎng kǎo Zhōngwén jiǎndìng.", "Next year I want to take a Chinese proficiency test."], ["我也想存一些錢，帶爸爸媽媽來台灣玩。", "Wǒ yě xiǎng cún yìxiē qián, dài bàba māma lái Táiwān wán.", "I also want to save some money to bring my parents to visit Taiwan."], ["只要每天努力一點，我相信夢想會實現。", "Zhǐyào měitiān nǔlì yìdiǎn, wǒ xiāngxìn mèngxiǎng huì shíxiàn.", "As long as I work a little harder each day, I believe my dreams will come true."]]], ["46. Lời cảm ơn (感謝)", [["來到台灣以後，我遇到很多好人。", "Láidào Táiwān yǐhòu, wǒ yùdào hěn duō hǎo rén.", "Since coming to Taiwan I have met many good people."], ["同事、鄰居和老師都很照顧我。", "Tóngshì, línjū hé lǎoshī dōu hěn zhàogù wǒ.", "Coworkers, neighbors and teachers all look after me well."], ["我要說一聲謝謝，我會繼續加油。", "Wǒ yào shuō yì shēng xièxie, wǒ huì jìxù jiāyóu.", "I want to say thank you, and I will keep doing my best."]]]]));
